apiVersion: apps/v1
kind: Deployment
metadata:
  name: overload
  namespace: overload
  labels:
    app: overload
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: overload
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: overload
    spec:
      containers:
        - name: web
          image: ghcr.io/vissu89/overload:651c3f9
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
